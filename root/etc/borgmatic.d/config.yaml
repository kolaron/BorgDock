# BorgDock Borgmatic Configuration Template
#
# Customize this file for your backup needs. Environment variables are supported:
#   ${BORG_SOURCE_1}, ${BORG_SOURCE_2}, ${BORG_SOURCE_3}, ${BORG_SOURCE_4}
#   ${BORG_REPO_PATH}
#   ${BORG_PASSPHRASE}
#   ${BORG_COMPRESSION}
#
# For orchestration hooks (stop/start containers, databases, etc.), 
# add a 'commands:' section at the bottom. See borgmatic documentation:
# https://torsion.org/borgmatic/docs/how-to/add-preparation-and-cleanup-steps-to-backups/

source_directories:
  - ${BORG_SOURCE_1:/home}
  - ${BORG_SOURCE_2:/etc}

# Repository storage location
repositories:
  - path: ${BORG_REPO_PATH:-/mnt/backup/borg-repo}
    label: backup

# Encryption and passphrase
encryption:
  passphrase: ${BORG_PASSPHRASE}

# Compression settings
compression: ${BORG_COMPRESSION:-zstd,8}

# Archive naming scheme
archive_name_format: '{hostname}-{now:%Y%m%d-%H%M%S}'

# Exclude patterns
exclude_patterns:
  - '**/.cache'
  - '**/__pycache__'
  - '**/node_modules'

# Backup statistics
checks:
  - name: repository
    frequency: 2 weeks
  - name: archives
    frequency: 2 weeks

# Retention policy
retention:
  keep_daily: 7
  keep_weekly: 4
  keep_monthly: 3
  keep_yearly: 1

