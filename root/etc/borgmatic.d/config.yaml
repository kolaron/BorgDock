# BorgDock Borgmatic Configuration
# 
# This config uses environment variable substitution for portability.
# Set these in docker-compose.yml or via Docker Secrets:
#
#   BACKUP_MOUNT_PATH      - Mount point for USB disk (default: /mnt/backup)
#   BORG_REPO_PATH         - Borg repository path (default: /mnt/backup/borg-repo)
#   BORG_SOURCE_1, ...     - Backup source directories
#   BORG_PASSPHRASE_FILE   - Path to passphrase file (default: /run/secrets/borg_passphrase)
#   BORG_COMPRESSION       - Compression setting (default: zstd,8)
#   BACKUP_TIMEZONE        - Timezone for logging (default: UTC)

source_directories:
  - ${BORG_SOURCE_1:-/mnt/backup}
  - ${BORG_SOURCE_2}
  - ${BORG_SOURCE_3}
  - ${BORG_SOURCE_4}

# Repository storage location (on mounted USB disk)
repositories:
  - path: ${BORG_REPO_PATH:-/mnt/backup/borg-repo}
    label: backup

# Encryption and passphrase
encryption:
  passphrase: ${BORG_PASSPHRASE}

# Compression settings
compression: ${BORG_COMPRESSION:-zstd,8}

# Archive naming scheme
archive_name_format: '{hostname}-{now:%Y%m%d-%H%M%S}'

# Exclude patterns
exclude_patterns:
  # ZFS snapshots
  - '/tank/*/.zfs/*'
  # Docker volumes
  - '**/.cache'
  - '**/__pycache__'
  - '**/node_modules'

# Backup statistics
checks:
  - name: repository
    frequency: 2 weeks
  - name: archives
    frequency: 2 weeks

# Retention policy: keep recent backups
retention:
  keep_minutely: 0
  keep_hourly: 0
  keep_daily: 7
  keep_weekly: 4
  keep_monthly: 3
  keep_yearly: 1

# Execution hooks: run SSH commands to stop/start services on Proxmox VMs
# Uses 'commands' syntax (Borgmatic 2.x) with 'states' to control when hooks run
# Available states: [start, finish, fail]
#
# Requires:
#   - SSH key at /root/.ssh/id_ed25519 (read-only, mounted in docker-compose.yml)
#   - SSH access to Proxmox host as root
#
# Update SSH commands below with your actual Proxmox host address

commands:
  - before: everything
    run:
      - 'ssh -i /root/.ssh/id_ed25519 -o StrictHostKeyChecking=no root@proxmox-host "pct exec 103 -- bash -c \"docker compose -p immich -f /var/lib/docker/volumes/arcane-data/_data/projects/Immich/compose.yaml stop\"" || true'
      - 'ssh -i /root/.ssh/id_ed25519 -o StrictHostKeyChecking=no root@proxmox-host "qm guest exec 100 -- bash -c \"docker compose -p opencloud -f /srv/docker-data/projects/OpenCloud/docker-compose.yml stop\"" || true'
      - 'ssh -i /root/.ssh/id_ed25519 -o StrictHostKeyChecking=no root@proxmox-host "qm guest exec 100 -- bash -c \"docker compose -p calibrewebautomated -f /srv/docker-data/projects/Calibre_web_automated/compose.yaml stop\"" || true'
      - 'ssh -i /root/.ssh/id_ed25519 -o StrictHostKeyChecking=no root@proxmox-host "qm guest exec 100 -- bash -c \"docker compose -p paperless -f /srv/docker-data/projects/Paperless/compose.yaml stop\"" || true'
  
  - after: everything
    states: [finish, fail]
    run:
      - 'ssh -i /root/.ssh/id_ed25519 -o StrictHostKeyChecking=no root@proxmox-host "qm guest exec 100 -- bash -c \"docker compose -p paperless -f /srv/docker-data/projects/Paperless/compose.yaml start\"" || true'
      - 'ssh -i /root/.ssh/id_ed25519 -o StrictHostKeyChecking=no root@proxmox-host "qm guest exec 100 -- bash -c \"docker compose -p calibrewebautomated -f /srv/docker-data/projects/Calibre_web_automated/compose.yaml start\"" || true'
      - 'ssh -i /root/.ssh/id_ed25519 -o StrictHostKeyChecking=no root@proxmox-host "qm guest exec 100 -- bash -c \"docker compose -p opencloud -f /srv/docker-data/projects/OpenCloud/docker-compose.yml start\"" || true'
      - 'ssh -i /root/.ssh/id_ed25519 -o StrictHostKeyChecking=no root@proxmox-host "pct exec 103 -- bash -c \"docker compose -p immich -f /var/lib/docker/volumes/arcane-data/_data/projects/Immich/compose.yaml start\"" || true'

# Borgmatic logging
verbosity: 1
